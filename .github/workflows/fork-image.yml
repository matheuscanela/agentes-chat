# Fork build: upstream's Dockerfile, built from this branch (upstream release + our patches) and pushed to GHCR.
# Tags: <upstream version>-mc.<run number> and the commit. Nothing secret goes in: the image is public.
name: fork-image

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          base=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
          echo "tag=${base#v}-mc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentes" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.v.outputs.repo }}:${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
