# Fork build. Every day (and on a push to this branch, or by hand) it takes upstream's latest main, applies our
# patches (the code changes between upstream's v0.1.1 and this branch), runs the tests that cover them, and pushes
# upstream's own Dockerfile build to GHCR as a public image:
#   ghcr.io/<owner>/agentes:main-<upstream sha>-mc<patch hash>      (immutable)   and   :edge   (moves)
# Nothing is deployed from here: bump AGENTES_VERSION in Komodo to use a build. Nothing secret goes in the image.
# A patch that no longer applies, or a test that fails, opens an issue and builds nothing. Once upstream merges a
# patch, applying it again is a no-op and `git apply` skips nothing: drop its commit from this branch then.
name: fork-image

on:
  schedule:
    - cron: "17 17 * * *" # 03:17 in Sydney, after upstream's day
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      base:
        description: "Upstream ref to build on (main, or a tag such as v0.1.1)"
        default: main

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: fork-image
  cancel-in-progress: false

env:
  PATCH_BASE: v0.1.1 # the upstream tag the patches on this branch were written against

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy
          fetch-depth: 0

      - name: Take the patches and upstream's code
        id: src
        env:
          BASE: ${{ inputs.base || 'main' }}
        run: |
          set -eu
          git remote add upstream https://github.com/agentes-chat/agentes-chat.git
          git fetch -q upstream --tags "+refs/heads/main:refs/remotes/upstream/main"
          ref="upstream/main"; [ "$BASE" = main ] || ref="refs/tags/$BASE"
          sha=$(git rev-parse "$ref^{commit}")
          # The code only: docs (ADR index, SELF_HOSTING) and this workflow stay on this branch.
          git diff "$PATCH_BASE" deploy -- . ':!docs' ':!SELF_HOSTING.md' ':!.github' > "$RUNNER_TEMP/fork.patch"
          phash=$(sha256sum "$RUNNER_TEMP/fork.patch" | cut -c1-7)
          tag="main-${sha:0:7}-mc${phash}"
          [ "$BASE" = main ] || tag="${BASE#v}-mc${phash}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentes" >> "$GITHUB_OUTPUT"

      - name: Already built?
        id: have
        if: github.event_name == 'schedule'
        run: |
          if docker buildx imagetools inspect "${{ steps.src.outputs.repo }}:${{ steps.src.outputs.tag }}" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.src.outputs.tag }} is already built."
          fi

      - name: Apply the patches to upstream
        id: apply
        if: steps.have.outputs.built != 'true'
        run: |
          set -eu
          git checkout -q --detach "${{ steps.src.outputs.sha }}"
          git config user.name fork-image && git config user.email fork-image@users.noreply.github.com
          if ! git apply --3way --index "$RUNNER_TEMP/fork.patch"; then
            git status --short | grep -E '^(UU|AA|DU|UD)' || true
            echo "failed=apply" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.have.outputs.built != 'true'
        with:
          bun-version: "1.4.4" # the Dockerfile's

      - name: Tests that cover the patches
        if: steps.have.outputs.built != 'true'
        run: |
          set -eu
          bun install --frozen-lockfile
          bun test packages/providers/test packages/engine/test/endpoints.test.ts packages/client/test/endpoints-lib.test.ts packages/i18n/test

      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.built != 'true'
      - uses: docker/login-action@v3
        if: steps.have.outputs.built != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.have.outputs.built != 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ steps.src.outputs.repo }}:${{ steps.src.outputs.tag }}
            ${{ steps.src.outputs.repo }}:edge
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say so when it broke
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="fork image: upstream ${{ steps.src.outputs.sha }} doesn't build with our patches"
          if [ -z "$(gh issue list --state open --search "fork image in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body "The daily fork build failed (the patches no longer apply, or a test failed). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
